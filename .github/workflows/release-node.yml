# npm trusted publisher: retab-dev/retab, workflow release-node.yml.
# Enable direct publishing for that publisher in @retab/node's npm settings.
# No npm token is needed. Commit the intended clients/node/package.json version
# and lockfile first, then run this workflow on main with publish=true.
# The default run validates and saves the package without publishing it.
name: Release Node SDK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the committed @retab/node version to npm"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-node
  cancel-in-progress: false

jobs:
  package:
    name: Build and test package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - name: Install dependencies and build
        run: npm ci
      - name: Run SDK tests without live credentials
        run: bun test tests/
        env:
          RETAB_ENV_FILE: /dev/null
      - name: Pack the tested SDK
        run: |
          mkdir -p "$RUNNER_TEMP/node-sdk"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/node-sdk"
      - name: Check publication eligibility
        if: inputs.publish
        run: npm publish "$RUNNER_TEMP"/node-sdk/*.tgz --dry-run --ignore-scripts --access public
      - uses: actions/upload-artifact@v4
        with:
          name: node-sdk-package
          path: ${{ runner.temp }}/node-sdk/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm with OIDC
    needs: package
    if: inputs.publish && github.repository == 'retab-dev/retab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: node-sdk-package
          path: ${{ runner.temp }}/node-sdk
      - name: Publish the tested package
        run: npm publish "$RUNNER_TEMP"/node-sdk/*.tgz --ignore-scripts --access public --provenance
